name: ci

# Lint + network-free regression tests for the casket pipeline scripts.
# The actual pipeline (a / a-rpm / b / b-operand) needs `oc`, a registry.redhat.io pull secret
# and mksquashfs, so it can't run on GitHub-hosted runners — this guards the
# pure logic (resolution strategies, label parsing) and script syntax instead.
#
# All jobs run inside Fedora containers for access to up-to-date tooling
# (Python 3.13+, ShellCheck via dnf, tomllib in stdlib).

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      - name: install toolchain
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            python3 python3-pip findutils git-core ShellCheck
          dnf clean all
          python3 -m pip install --quiet ruff
          echo "--- versions ---"
          bash --version | head -1
          python3 --version
          shellcheck --version

      - uses: actions/checkout@v4

      - name: shellcheck + bash -n (all *.sh)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rc=0
          # tracked shell scripts only (work dirs are gitignored anyway)
          mapfile -t sh < <(git ls-files '*.sh')
          for f in "${sh[@]}"; do
            bash -n "$f" || { echo "::error file=$f::bash -n failed"; rc=1; }
          done
          # Gate on errors only (real bugs). SC1091: don't follow sourced files.
          shellcheck -S error -e SC1091 "${sh[@]}" || rc=1
          # Warnings are informational for now (pre-existing style nits).
          echo "::group::shellcheck warnings (non-blocking)"
          shellcheck -S warning -e SC1091 "${sh[@]}" || true
          echo "::endgroup::"
          exit $rc

      - name: python syntax + ruff
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mapfile -t py < <(git ls-files '*.py')
          for f in "${py[@]}"; do
            python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$f" \
              || { echo "::error file=$f::syntax error"; exit 1; }
          done
          # lint, but don't fail the build on style-only findings yet
          ruff check "${py[@]}" || true

  test:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      - name: install runtime
        run: |
          # `ansible` (not just ansible-core) for the community.general and
          # ansible.posix collections the playbooks call; tests/test_ansible.sh
          # asserts they resolve, so a bare ansible-core would fail the build.
          # ansible-lint is not packaged for Fedora, hence pip.
          dnf install -y --setopt=install_weak_deps=False \
            python3 python3-pip findutils git-core ripgrep ansible
          dnf clean all
          python3 -m pip install --quiet pytest pytest-cov ansible-lint
          echo "--- versions ---"
          bash --version | head -1
          python3 --version
          ansible --version | head -1
          ansible-lint --version

      - uses: actions/checkout@v4

      # Every tests/*.sh is discovered and run, so a newly added bash test
      # takes effect without touching this file. The previous form listed each
      # script as its own step, and the two tests added on 2026-09-13
      # (test_casket_mounts_fstype.sh, test_unit_running.sh -- the latter the
      # regression guard for the opengrok.service flap) were never wired in and
      # silently did not run in CI.
      #
      # An empty glob is a hard failure, not a green no-op: auto-discovery that
      # finds nothing is exactly how a suite goes quiet without anyone noticing.
      #
      # The loop keeps going after a failure and reports every broken script at
      # the end, instead of stopping at the first one the way separate steps did.
      - name: bash regression tests
        run: |
          shopt -s nullglob
          tests=(tests/*.sh)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "no tests/*.sh found -- wrong working directory?" >&2
            exit 1
          fi
          failed=()
          for t in "${tests[@]}"; do
            echo "::group::$t"
            if bash "$t"; then echo "PASS $t"; else failed+=("$t"); fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            printf 'FAILED: %s\n' "${failed[@]}" >&2
            exit 1
          fi
          echo "all ${#tests[@]} bash tests passed"

      - name: python resolver tests
        run: >
          python3 -m pytest tests/ -q
          --cov=scripts --cov=mcp --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=100

      - name: upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python
          fail_ci_if_error: false

  typecheck:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      - name: install runtime
        run: |
          dnf install -y --setopt=install_weak_deps=False python3 python3-pip git-core
          dnf clean all
          python3 -m pip install --quiet mypy

      - uses: actions/checkout@v4

      - name: mypy (scripts + mcp)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mapfile -t py < <(git ls-files '*.py')
          python3 -m mypy --ignore-missing-imports --no-error-summary "${py[@]}" || true
          echo "--- type errors above are informational for now ---"

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build srpm-collect image
        run: |
          docker build -f containers/srpm-collect/Containerfile \
            containers/srpm-collect \
            2>&1 | tail -5
          echo "srpm-collect: build succeeded"

      - name: build srpm-expand image
        run: |
          docker build -f containers/srpm-expand/Containerfile \
            containers/srpm-expand \
            2>&1 | tail -5
          echo "srpm-expand: build succeeded"
