name: ci

# Lint + network-free regression tests for the casket pipeline scripts.
# The actual pipeline (a / a-rpm / b / b-operand) needs `oc`, a registry.redhat.io pull secret
# and mksquashfs, so it can't run on GitHub-hosted runners — this guards the
# pure logic (resolution strategies, label parsing) and script syntax instead.
#
# All jobs run inside UBI 9 containers to match the production RHEL environment.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: registry.access.redhat.com/ubi9/ubi:latest
    steps:
      - name: install toolchain
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            python3 python3-pip findutils git-core tar xz
          dnf clean all
          # ShellCheck static binary (not in UBI9 default repos)
          SC_VER=v0.10.0
          curl -sL "https://github.com/koalaman/shellcheck/releases/download/${SC_VER}/shellcheck-${SC_VER}.linux.x86_64.tar.xz" \
            | tar -xJf - --strip-components=1 -C /usr/local/bin "shellcheck-${SC_VER}/shellcheck"
          shellcheck --version
          python3 -m pip install --quiet ruff
          echo "--- versions ---"
          bash --version | head -1
          python3 --version

      - uses: actions/checkout@v4

      - name: shellcheck + bash -n (all *.sh)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rc=0
          # tracked shell scripts only (work dirs are gitignored anyway)
          mapfile -t sh < <(git ls-files '*.sh')
          for f in "${sh[@]}"; do
            bash -n "$f" || { echo "::error file=$f::bash -n failed"; rc=1; }
          done
          # Gate on errors only (real bugs). SC1091: don't follow sourced files.
          shellcheck -S error -e SC1091 "${sh[@]}" || rc=1
          # Warnings are informational for now (pre-existing style nits).
          echo "::group::shellcheck warnings (non-blocking)"
          shellcheck -S warning -e SC1091 "${sh[@]}" || true
          echo "::endgroup::"
          exit $rc

      - name: python syntax + ruff
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mapfile -t py < <(git ls-files '*.py')
          for f in "${py[@]}"; do
            python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$f" \
              || { echo "::error file=$f::syntax error"; exit 1; }
          done
          # lint, but don't fail the build on style-only findings yet
          ruff check "${py[@]}" || true

  test:
    runs-on: ubuntu-latest
    container:
      image: registry.access.redhat.com/ubi9/ubi:latest
    steps:
      - name: install runtime
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            python3 python3-pip findutils git-core
          dnf clean all
          python3 -m pip install --quiet pytest
          echo "--- versions ---"
          bash --version | head -1
          python3 --version

      - uses: actions/checkout@v4

      - name: bash resolution regression tests
        run: bash tests/test_resolve.sh

      - name: bash opengrok staging regression tests
        run: bash tests/test_stage.sh

      - name: bash stage-reclaim guard tests
        run: bash tests/test_reclaim.sh

      - name: bash freshness verdict tests
        run: bash tests/test_freshness.sh

      - name: bash artifact-path handoff tests
        run: bash tests/test_artifact_path.sh

      - name: bash mount_path_for tests
        run: bash tests/test_mount_path.sh

      - name: bash read_units (fingerprint) tests
        run: bash tests/test_fingerprint.sh

      - name: python resolver tests
        run: python3 -m pytest tests/ -q
