# Weekly upstream link-health check (docs/collection-model.md §8).
# Probes every (repo, ref) recorded in state/upstream-sources.tsv — the
# committed flattening of the caskets' provenance records — against the
# GitHub API (repo existence/rename) and codeload archive URLs (the exact
# URL family the fetch pipelines use). Collected content is safe inside the
# caskets; a failure here is an early warning that a source could not be
# RE-fetched today (repo deleted/renamed/private, tag removed).
#
# Refresh the manifest on casket-host with scripts/export-upstream-sources.sh
# and commit it whenever the collection set changes.
name: upstream-link-check

on:
  schedule:
    - cron: '0 0 * * 6'   # Sat 00:00 UTC = Sat 09:00 JST, after the Friday-night staging run
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Check upstream links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/check-upstream-links.py --jobs 8 | tee link-check-report.txt
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-report
          path: link-check-report.txt
          retention-days: 90
